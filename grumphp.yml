grumphp:
    ascii:
        failed: null
        succeeded: null
    process_timeout: 600
    testsuites:
      security:
          tasks:
            - securitychecker_composeraudit
      style:
          tasks:
            - phpmd3
            - shell
      syntax:
          tasks:
            - composer
            - git_blacklist
            - phplint
      static:
          tasks:
            - phpstan
    tasks:
      composer:
          metadata: {priority: 800}
      securitychecker_composeraudit:
          metadata: {priority: 700}
      git_blacklist:
          # Calls to dd(), ddd(), dump(), ray(), var_dump(), die() and exit(), plus bare die; and exit;
          # The leading group prevents matches such as add( or array(, but still catches $collection->dd()
          keywords:
            - '(^|[^[:alnum:]_])(dd|ddd|dump|ray|var_dump|die|exit)[[:space:]]*\('
            - '(^|[^[:alnum:]_])(die|exit)[[:space:]]*;'
          regexp_type: E
          metadata: {priority: 600}
      phplint:
          metadata: {priority: 400}
          triggered_by: ['php']
      phpstan:
          ignore_patterns: ['/^tests(.*)/', '/^database(.*)/', '/^config(.*)/', '/^routes(.*)/', '/deploy.php/', '/^nova(.*)/',]
          configuration: vendor/lasselehtinen/laravel-conventions-checker/phpstan.neon
          level: 5
          metadata: {priority: 300}
      shell:
          scripts:
            - ["-c", "vendor/bin/pint --test"]
          metadata: {priority: 250, label: pint}
      phpmd3:
          whitelist_patterns: ['/^app(.*)/', '/^config(.*)/', '/^recources(.*)/']
          ruleset: ['vendor/lasselehtinen/laravel-conventions-checker/ruleset.xml']
          metadata: {priority: 200}
      phpunit:
          metadata: {priority: 100}
